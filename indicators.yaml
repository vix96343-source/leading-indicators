# 先行指標ダッシュボードの定義ファイル
# 指標の追加・削除はここだけで行う（コード変更不要）。
#
# indicators[].source ごとの params:
#   yfinance:   ticker
#   fred:       series (FRED の系列ID)
#   jmtba:      field (total / domestic / foreign / china / elec_precision)
#   seaj:       field (semi_jp)
#   esri:       field (juchu_core / juchu_foreign / juchu_total)
#   industry_jp: field (housing_total / housing_owner / housing_rental / steel_crude /
#                       jsim_total / jsim_domestic / jsim_foreign / inbound_total / inbound_china)
#   ctia:       field (w_apt / w_concentrate / w_ferro / w_powder / w_apt_eu)  ※ restricted
#
# related: 行を押したときに右側に出す関連企業（baskets.yaml のバスケット名）
# good: up = 上昇が関連銘柄の追い風 / down = 低下が追い風 / neutral = 方向で良し悪しを付けない
# scale: 表示時に値へ掛ける倍率（単位換算）  stale_days: 「更新停止?」と出すまでの日数
# change: diff なら変化を率でなく差（pt）で表示（金利など）
# restricted: true は `--public` ビルドで除外（転載制限のあるデータ）
# yoy:  true なら月次の前年比と、その3か月前からの変化（加速/減速）を主表示にする

site:
  title: 先行指標ダッシュボード
  timezone: Asia/Tokyo

groups:
  - id: semi
    name: 業界：半導体
    note: TrendForce の DRAM・NAND 価格（全品目）、日本製半導体製造装置、米半導体生産、SOX とメモリ大手の株価。
    public_note: SOX とメモリ大手の株価。TrendForce・SEAJ は規約上公開できないため手元の全指標版（local/index.html）にだけ載せている。
  - id: machinery
    name: 業界：機械
    note: 工作機械・産業機械・機械受注（内閣府）。設備投資の先行指標。
  - id: housing
    name: 業界：住宅・建設
    note: 新設住宅着工（国交省）と米住宅着工許可、木材価格。
  - id: other_ind
    name: 業界：鉄鋼・観光
    note: 粗鋼生産（鉄鋼連盟）と訪日外客数（JNTO）。
  - id: materials
    name: 素材価格
    note: 貴金属・ベースメタル・鉄鋼原料・エネルギーの先物と、レアメタル関連 ETF。タングステンは中钨在线の日次市況（手元版のみ）。
    public_note: 貴金属・ベースメタル・鉄鋼原料・エネルギーの先物と、レアメタル関連 ETF。タングステン価格は規約上公開できないため手元版にだけ載せている。
  - id: market
    name: 市場ベース
    note: 日次の株価指数・金利・為替。1か月・3か月の変化を見る。

# TrendForce の DRAM・NAND 価格表は、ページ上の全品目を自動で取る（品目の指定は不要）。
# 規約上公開できないため --public では取得も表示もしない。
trendforce:
  group: semi
  related: memory

