# 先行指標ダッシュボードの定義ファイル
# 指標の追加・削除はここだけで行う（コード変更不要）。
#
# indicators[].source ごとの params:
#   yfinance:   ticker
#   fred:       series (FRED の系列ID)
#   jmtba:      field (total / domestic / foreign / china / elec_precision)
#   seaj:       field (semi_jp)
#   cao_surveys: field (watcher_future / watcher_current / consumer_confidence)
#   esri:       field (ci_leading / juchu_core / juchu_foreign / juchu_total)
#
# good: up = 上昇が関連銘柄の追い風 / down = 低下が追い風 / neutral = 方向で良し悪しを付けない
# scale: 表示時に値へ掛ける倍率（単位換算）  stale_days: 「更新停止?」と出すまでの日数
# change: diff なら変化を率でなく差（pt）で表示（金利など）
# restricted: true は `--public` ビルドで除外（転載制限のあるデータ）
# yoy:  true なら月次の前年比と、その3か月前からの変化（加速/減速）を主表示にする

site:
  title: 先行指標ダッシュボード
  timezone: Asia/Tokyo

groups:
  - id: semi
    name: 半導体市場
    note: TrendForce の DRAM・NAND 価格（全品目）とメモリ大手の株価。TrendForce の価格履歴はこのツールが毎営業日取得して蓄積する。
    public_note: メモリ大手の株価。TrendForce の価格は規約上公開できないため、手元の全指標版（local/index.html）にだけ載せている。
  - id: japan
    name: 国内景気
    note: 内閣府の景気動向指数・機械受注・景気ウォッチャー・消費者態度指数と、日本の輸出。
  - id: industry
    name: 業界統計（受注・出荷）
    note: 月次統計。前年比と、その3か月前からの変化（加速/減速）を見る。
  - id: macro
    name: 海外景気
    note: OECD 景気先行指数と各国の輸出・生産（FRED）。
  - id: us
    name: 米国景気
    note: 米国の受注・住宅・雇用・企業景況感（FRED）。
  - id: market
    name: 市場ベース
    note: 日次の価格・金利。1か月・3か月の変化と、過去1年のレンジ内の位置を見る。

# TrendForce の DRAM・NAND 価格表は、ページ上の全品目を自動で取る（品目の指定は不要）。
# 規約上公開できないため --public では取得も表示もしない。
trendforce:
  group: semi

indicators:
  # ── 半導体市場 ─────────────────────────────────────────────
  - id: mu
    group: semi
    name: マイクロン 株価
    source: yfinance
    params: {ticker: MU}
    unit: USD
    freq: daily
    good: up
    lead: メモリ市況の市場評価
  - id: hynix
    group: semi
    name: SKハイニックス 株価
    source: yfinance
    params: {ticker: "000660.KS"}
    unit: KRW
    freq: daily
    good: up
    lead: HBM・DRAM市況の市場評価

  # ── 国内景気 ───────────────────────────────────────────────
  - id: ci_leading
    group: japan
    name: 景気動向指数 CI先行
    source: esri
    params: {field: ci_leading}
    unit: 2020年=100
    freq: monthly
    good: up
    lead: 内閣府の先行11系列の合成。景気の山・谷に数か月先行
  - id: juchu_core
    group: japan
    name: コア機械受注（船舶・電力除く民需）
    source: esri
    params: {field: juchu_core}
    stale_days: 110    # 公表が約1.5か月遅れのため
    unit: 百万円
    freq: monthly
    yoy: true
    good: up
    lead: 国内設備投資の代表的な先行指標（季調値）→ FA・機械・建機
  - id: juchu_foreign
    group: japan
    name: 機械受注 外需
    source: esri
    params: {field: juchu_foreign}
    stale_days: 110    # 公表が約1.5か月遅れのため
    unit: 百万円
    freq: monthly
    yoy: true
    good: up
    lead: 海外からの機械受注（季調値）
  - id: watcher_future
    group: japan
    name: 景気ウォッチャー 先行き判断DI
    source: cao_surveys
    params: {field: watcher_future}
    change: diff
    unit: DI
    freq: monthly
    good: up
    lead: 小売・飲食・タクシー・企業などの現場の2〜3か月先の見方（50が中立）。毎月8日前後に前月分
  - id: watcher_current
    group: japan
    name: 景気ウォッチャー 現状判断DI
    source: cao_surveys
    params: {field: watcher_current}
    change: diff
    unit: DI
    freq: monthly
    good: up
    lead: 現場の景況感（50が中立）
  - id: consumer_confidence
    group: japan
    name: 消費者態度指数
    source: cao_surveys
    params: {field: consumer_confidence}
    change: diff
    unit: 指数
    freq: monthly
    good: up
    lead: 景気動向指数の先行系列の1つ。内需・小売
  - id: jp_exports
    group: japan
    name: 日本 輸出額
    source: fred
    params: {series: XTEXVA01JPM667S}
    scale: 1.0e-8
    unit: 億ドル
    stale_days: 130
    freq: monthly
    yoy: true
    good: up
    lead: 外需全体（ドル建て、発表は約2か月遅れ）

  # ── 業界統計 ───────────────────────────────────────────────
  - id: jmtba_total
    group: industry
    name: 工作機械受注 総額
    source: jmtba
    params: {field: total}
    unit: 百万円
    freq: monthly
    yoy: true
    good: up
    lead: 設備投資の先行指標 → ファナック・DMG森精機・オークマ・THK
  - id: jmtba_domestic
    group: industry
    name: 工作機械受注 内需
    source: jmtba
    params: {field: domestic}
    unit: 百万円
    freq: monthly
    yoy: true
    good: up
    lead: 国内製造業の設備投資
  - id: jmtba_foreign
    group: industry
    name: 工作機械受注 外需
    source: jmtba
    params: {field: foreign}
    unit: 百万円
    freq: monthly
    yoy: true
    good: up
    lead: 海外製造業の設備投資
  - id: jmtba_china
    group: industry
    name: 工作機械受注 中国
    source: jmtba
    params: {field: china}
    unit: 百万円
    freq: monthly
    yoy: true
    good: up
    lead: 中国の設備投資（確報ベース、速報より約3週遅れ）
  - id: jmtba_elec
    group: industry
    name: 工作機械受注 内需 電気・精密
    source: jmtba
    params: {field: elec_precision}
    unit: 百万円
    freq: monthly
    yoy: true
    good: up
    lead: 国内の電子部品・半導体関連の設備投資（確報ベース）
  - id: seaj_semi
    group: industry
    name: 日本製半導体製造装置 販売高(3MA)
    source: seaj
    params: {field: semi_jp}
    unit: 百万円
    freq: monthly
    yoy: true
    good: up
    lead: 東京エレクトロン・スクリーン・アドバンテスト・ディスコ
    restricted: true   # SEAJ は無断転載禁止。公開サイトに出す場合は false にしない

  # ── 海外景気 ───────────────────────────────────────
  - id: us_core_capex
    group: us
    name: 米 コア資本財受注
    source: fred
    params: {series: NEWORDER}
    unit: 百万ドル
    freq: monthly
    yoy: true
    good: up
    lead: 米企業の設備投資（航空機・防衛除く）
  - id: us_mfg_orders
    group: us
    name: 米 製造業新規受注
    source: fred
    params: {series: AMTMNO}
    unit: 百万ドル
    freq: monthly
    yoy: true
    good: up
    lead: 米製造業全体の需要
  - id: us_semi_ip
    group: macro
    name: 米 半導体・電子部品 生産指数
    source: fred
    params: {series: IPG3344S}
    unit: 指数
    freq: monthly
    yoy: true
    good: up
    lead: 半導体需要
  - id: kr_exports
    group: macro
    name: 韓国 輸出額
    source: fred
    params: {series: XTEXVA01KRM667S}
    scale: 1.0e-8      # ドル → 億ドル
    unit: 億ドル
    stale_days: 130    # 公表が約2か月遅れのため
    freq: monthly
    yoy: true
    good: up
    lead: 世界の電子部品・半導体需要の早耳（発表は約2か月遅れ）
  - id: oecd_cli_jp
    group: macro
    name: OECD 景気先行指数 日本
    source: fred
    params: {series: JPNLOLITOAASTSAM}
    unit: 指数
    freq: monthly
    good: up
    lead: 100超=景気拡大方向
  - id: oecd_cli_us
    group: macro
    name: OECD 景気先行指数 米国
    source: fred
    params: {series: USALOLITOAASTSAM}
    unit: 指数
    freq: monthly
    good: up
    lead: 100超=景気拡大方向

  - id: oecd_cli_cn
    group: macro
    name: OECD 景気先行指数 中国
    source: fred
    params: {series: CHNLOLITOAASTSAM}
    unit: 指数
    freq: monthly
    good: up
    lead: 中国向け設備投資・素材需要
  - id: oecd_cli_de
    group: macro
    name: OECD 景気先行指数 ドイツ
    source: fred
    params: {series: DEULOLITOAASTSAM}
    unit: 指数
    freq: monthly
    good: up
    lead: 欧州製造業
  - id: oecd_cli_kr
    group: macro
    name: OECD 景気先行指数 韓国
    source: fred
    params: {series: KORLOLITOAASTSAM}
    unit: 指数
    freq: monthly
    good: up
    lead: 半導体・電子部品サイクル

  # ── 米国景気 ───────────────────────────────────────────────
  - id: us_durable
    group: us
    name: 米 耐久財受注
    source: fred
    params: {series: DGORDER}
    unit: 百万ドル
    freq: monthly
    yoy: true
    good: up
    lead: 米製造業の受注全体
  - id: philly_orders
    group: us
    name: フィラデルフィア連銀 新規受注DI
    source: fred
    params: {series: NOCDFSA066MSFRBPHI}
    change: diff
    unit: DI
    freq: monthly
    good: up
    lead: 毎月いちばん早く出る地区連銀の製造業景況感（0超=拡大）
  - id: empire_orders
    group: us
    name: NY連銀 新規受注DI
    source: fred
    params: {series: NOCDISA066MSFRBNY}
    change: diff
    unit: DI
    freq: monthly
    good: up
    lead: ニューヨーク州の製造業景況感（0超=拡大）
  - id: us_permits
    group: us
    name: 米 住宅着工許可件数
    source: fred
    params: {series: PERMIT}
    unit: 千戸(年率)
    freq: monthly
    yoy: true
    good: up
    lead: 住宅投資の先行指標 → 建材・住設
  - id: us_claims
    group: us
    name: 米 新規失業保険申請件数
    source: fred
    params: {series: ICSA}
    unit: 件
    freq: daily
    stale_days: 14
    good: down
    lead: 週次。増加は景気悪化のサイン
  - id: us_umich
    group: us
    name: ミシガン大 消費者信頼感
    source: fred
    params: {series: UMCSENT}
    unit: 指数
    freq: monthly
    good: up
    lead: 個人消費の先行

  # ── 市場ベース ─────────────────────────────────────────────
  - id: sox
    group: market
    name: フィラデルフィア半導体指数
    source: yfinance
    params: {ticker: "^SOX"}
    unit: pt
    freq: daily
    good: up
    lead: 半導体サイクル → 日本の半導体・装置株
  - id: copper
    group: market
    name: 銅先物
    source: yfinance
    params: {ticker: "HG=F"}
    unit: USD/lb
    freq: daily
    good: up
    lead: 「ドクター・カッパー」世界景気の体温計
  - id: bdry
    group: market
    name: ドライバルク運賃ETF (BDRY)
    source: yfinance
    params: {ticker: BDRY}
    unit: USD
    freq: daily
    good: up
    lead: バルチック海運指数の代替。海運株・資源需要
  - id: kospi
    group: market
    name: KOSPI
    source: yfinance
    params: {ticker: "^KS11"}
    unit: pt
    freq: daily
    good: up
    lead: 輸出・半導体依存度が高く世界景気に先行しやすい
  - id: us10y
    group: market
    name: 米10年債利回り
    source: yfinance
    params: {ticker: "^TNX"}
    change: diff       # 金利は % 変化でなく pt 差で見る
    unit: "%"
    freq: daily
    good: neutral
    lead: グロース株の割引率
  - id: us_curve
    group: market
    name: 米 長短金利差(10Y-2Y)
    source: fred
    params: {series: T10Y2Y}
    change: diff       # 金利は % 変化でなく pt 差で見る
    unit: "%pt"
    freq: daily
    good: neutral
    lead: 逆イールド解消後は景気後退入りの警戒
  - id: hy_spread
    group: market
    name: 米ハイイールド債スプレッド
    source: fred
    params: {series: BAMLH0A0HYM2}
    change: diff
    unit: "%pt"
    freq: daily
    good: down
    lead: 信用リスク。拡大は株安・景気悪化に先行しやすい
  - id: us_curve_3m
    group: market
    name: 米 長短金利差(10Y-3M)
    source: fred
    params: {series: T10Y3M}
    change: diff
    unit: "%pt"
    freq: daily
    good: neutral
    lead: NY連銀の景気後退確率モデルで使われる金利差
  - id: crude
    group: market
    name: WTI原油先物
    source: yfinance
    params: {ticker: "CL=F"}
    unit: USD
    freq: daily
    good: neutral
    lead: 需要の強さとコスト両面
  - id: usdjpy
    group: market
    name: ドル円
    source: yfinance
    params: {ticker: "JPY=X"}
    unit: 円
    freq: daily
    good: neutral
    lead: 円安は輸出株の採算改善

