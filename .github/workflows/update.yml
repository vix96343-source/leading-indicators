name: update

on:
  # GitHub の定時実行は混雑時に数時間遅れたり飛ばされたりするため、1日4回に分け、混む毎時0分を避ける。
  # 同じデータを何度取っても上書きされるだけなので重複して動いても問題ない。
  schedule:
    - cron: "17 10 * * 1-5"   # 19:17 JST（月次統計の15時台公表・国内株の終値の後）
    - cron: "17 12 * * 1-5"   # 21:17 JST（上の回が遅れた・飛んだときの予備）
    - cron: "17 14 * * 1-5"   # 23:17 JST（同上）
    - cron: "17 22 * * 0-4"   # 翌朝 7:17 JST（米国市場の終値・米国の統計）
  workflow_dispatch:
    inputs:
      backfill:
        description: "過去分をまとめて取得する（初回用）"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: test
        run: python -m pytest -q

      - name: fetch
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # 任意。設定すると FRED を公式 API で取得（安定）
        run: python -m src.cli fetch --public ${{ inputs.backfill && '--backfill' || '' }}

      - name: build
        # 公開サイトなので転載制限のある指標（TrendForce・SEAJ）は除外する
        run: python -m src.cli build --public

      - name: commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "update $(TZ=Asia/Tokyo date +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
