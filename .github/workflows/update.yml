name: update

on:
  # 平日 7:17〜23:17 JST に毎時更新（ページの「↻ 更新」は最新版を読み込み直すだけ）。
  # GitHub の定時実行は混雑時に遅れたり飛ばされたりするため、毎時0分を避け、回数で取りこぼしを補う。
  # 公開リポジトリなので Actions の実行に費用はかからない。
  schedule:
    - cron: "17 22,23 * * 0-4"   # 7:17・8:17 JST（米国市場の終値・米国の統計）
    - cron: "17 0-14 * * 1-5"    # 9:17〜23:17 JST（国内株・月次統計の公表）
  workflow_dispatch:
    inputs:
      backfill:
        description: "過去分をまとめて取得する（初回用）"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: test
        run: python -m pytest -q

      - name: fetch
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # 任意。設定すると FRED を公式 API で取得（安定）
        run: python -m src.cli fetch --public ${{ inputs.backfill && '--backfill' || '' }}

      - name: build
        # 公開サイトなので転載制限のある指標（TrendForce・SEAJ）は除外する
        run: python -m src.cli build --public

      - name: commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "update $(TZ=Asia/Tokyo date +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
